name: Update draft data
on:
  schedule:
    - cron: "23 11 * * *"   # once a day (~5-6 AM Central): college stats only change weekly
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build draft/data.json from the prospect list and ESPN college stats
        run: python draft/build_draft.py prospects_2027.json
      - name: Save the new data
        run: |
          git config user.name "dynoview-bot"
          git config user.email "dynoview-bot@users.noreply.github.com"
          git add draft/data.json draft/prospects_2027.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update draft data"
          git pull --rebase
          git push
